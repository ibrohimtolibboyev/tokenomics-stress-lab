[project]
name = "tokenomics-stress-lab"
version = "1.0.0"
description = "Independent simulations of token supply, unlocks and incentives under shocks."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.0", "matplotlib>=3.8", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tokenlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
